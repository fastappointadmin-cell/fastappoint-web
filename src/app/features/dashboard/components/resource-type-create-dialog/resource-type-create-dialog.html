<form class="space-y-4 p-1" (ngSubmit)="submit()">
	<h2 class="text-lg font-semibold text-slate-900">{{ 'dashboard.resources.typeCreateDialog.title' | transloco }}</h2>
	<p class="text-sm text-slate-600">{{ 'dashboard.resources.typeCreateDialog.body' | transloco }}</p>

	<label class="app-ui-field">
		<span class="app-ui-field-label">{{ 'dashboard.resources.typeCreateDialog.nameLabel' | transloco }}</span>
		<input class="app-ui-control" type="text" name="resourceTypeName" [ngModel]="name()" (ngModelChange)="name.set($event)" />
	</label>

	<div class="flex flex-col-reverse gap-2 pt-1 sm:flex-row sm:justify-end">
		<button type="button" class="app-ui-secondary-btn" (click)="cancel()">{{ 'common.cancel' | transloco }}</button>
		<button type="submit" class="app-ui-primary-btn">{{ 'common.create' | transloco }}</button>
	</div>
</form>
