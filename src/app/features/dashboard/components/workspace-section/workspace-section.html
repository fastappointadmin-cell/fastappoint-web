<section class="rounded-2xl bg-white/90 p-4 shadow-lg ring-1 ring-slate-200 backdrop-blur sm:p-5">
	<div class="mb-4 flex items-start justify-between gap-4">
		<div>
			<h2 class="text-lg font-semibold text-slate-900">{{ title() }}</h2>
			@if (subtitle()) {
				<p class="mt-1 text-sm text-slate-600">{{ subtitle() }}</p>
			}
		</div>

		@if (badge()) {
			<span class="rounded-full bg-slate-100 px-3 py-1 text-[11px] font-medium text-slate-600">{{ badge() }}</span>
		}
	</div>

	<ng-content />
</section>
