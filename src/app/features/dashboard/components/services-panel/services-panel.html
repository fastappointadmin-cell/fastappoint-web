<section class="services-panel-shell rounded-2xl bg-white/90 p-3 shadow-lg ring-1 ring-slate-200 backdrop-blur sm:p-5">
	<div class="services-paired-grid grid gap-3 xl:grid-cols-[300px_minmax(0,1fr)] xl:gap-4">
		<div class="services-quick-edit-column space-y-2 sm:space-y-3">
			<div class="services-quick-edit-card rounded-2xl border border-slate-200 bg-white/60 p-2">
				<div class="mb-2 px-2 pt-1 text-xs uppercase tracking-[0.12em] text-slate-500">{{ 'dashboard.common.quickEdit' | transloco }}</div>
				<div class="services-list-container">
					<pp-fixed-slots-list
						[hasItems]="filteredServices().length > 0"
						[emptyText]="'dashboard.services.emptyList'"
						[placeholderSlots]="servicePlaceholderSlots()"
						[selectedItemId]="selectedServiceId()"
						[persistSelectionKey]="'dashboard.services.list'"
						[rightPadding]="true"
						[addButtonLabel]="'dashboard.services.addNew'"
						[searchPlaceholder]="'dashboard.services.searchPlaceholder'"
						[searchValue]="serviceSearchQuery()"
						[showPagination]="true"
						[pageIndex]="servicePageIndex()"
						[pageCount]="servicePageCount()"
						[canGoPrevious]="hasPreviousServicePage()"
						[canGoNext]="hasNextServicePage()"
						(addClicked)="openCreateServiceDialog()"
						(restoredSelectedItemId)="restoreSelectedService($event)"
						(searchValueChange)="setServiceSearchQuery($event)"
						(previousPageClicked)="goToPreviousServicePage()"
						(nextPageClicked)="goToNextServicePage()"
						(capacityChange)="onServicesCapacity($event)"
					>
						<app-filter-popover fixed-slots-search-actions [icon]="'tune'" [ariaLabel]="'dashboard.services.filters.ariaLabel' | transloco" [title]="'dashboard.services.filters.title' | transloco" [panelSize]="'md'">
							<div class="app-ui-filter-form">
								<div class="app-ui-overlay-grid-2">
									<label class="app-ui-field">
										<span class="app-ui-field-label">{{ 'dashboard.services.filters.durationLabel' | transloco }}</span>
										<select class="app-ui-control" [ngModel]="durationOperator()" (ngModelChange)="setDurationOperator($any($event))">
											<option value="any">{{ 'dashboard.common.filterOperators.any' | transloco }}</option>
											<option value="lt">&lt;</option>
											<option value="lte">≤</option>
											<option value="eq">=</option>
											<option value="gte">≥</option>
											<option value="gt">&gt;</option>
											<option value="between">{{ 'dashboard.common.filterOperators.range' | transloco }}</option>
										</select>
									</label>

									<label class="app-ui-field">
										<span class="app-ui-field-label">{{ 'dashboard.common.filters.valueLabel' | transloco }}</span>
										<input class="app-ui-control" type="number" min="0" [ngModel]="durationValue()" (ngModelChange)="setDurationValue($event)" />
									</label>
								</div>
							</div>

							@if (durationOperator() === 'between') {
								<label class="app-ui-field">
									<span class="app-ui-field-label">{{ 'dashboard.services.filters.maxDurationLabel' | transloco }}</span>
									<input class="app-ui-control" type="number" min="0" [ngModel]="durationValueMax()" (ngModelChange)="setDurationValueMax($event)" />
								</label>
							}

							<div class="app-ui-filter-form">
								<div class="app-ui-overlay-grid-2">
									<label class="app-ui-field">
										<span class="app-ui-field-label">{{ 'dashboard.services.filters.requirementCountLabel' | transloco }}</span>
										<select class="app-ui-control" [ngModel]="requirementCountOperator()" (ngModelChange)="setRequirementCountOperator($any($event))">
											<option value="any">{{ 'dashboard.common.filterOperators.any' | transloco }}</option>
											<option value="lt">&lt;</option>
											<option value="lte">≤</option>
											<option value="eq">=</option>
											<option value="gte">≥</option>
											<option value="gt">&gt;</option>
											<option value="between">{{ 'dashboard.common.filterOperators.range' | transloco }}</option>
										</select>
									</label>

									<label class="app-ui-field">
										<span class="app-ui-field-label">{{ 'dashboard.common.filters.valueLabel' | transloco }}</span>
										<input class="app-ui-control" type="number" min="0" [ngModel]="requirementCountValue()" (ngModelChange)="setRequirementCountValue($event)" />
									</label>
								</div>
							</div>

							@if (requirementCountOperator() === 'between') {
								<label class="app-ui-field">
									<span class="app-ui-field-label">{{ 'dashboard.services.filters.maxRequirementCountLabel' | transloco }}</span>
									<input class="app-ui-control" type="number" min="0" [ngModel]="requirementCountValueMax()" (ngModelChange)="setRequirementCountValueMax($event)" />
								</label>
							}

							<div class="app-ui-overlay-actions">
								<button type="button" class="app-ui-reset-btn" (click)="clearServiceFilters()">{{ 'dashboard.common.reset' | transloco }}</button>
							</div>
						</app-filter-popover>

						@for (service of pagedServices(); track service.id) {
							<div class="fixed-slot-item flex items-center justify-between gap-2 rounded-xl border px-3 py-2 transition" [class.app-ui-row-selected]="selectedServiceId() === service.id" [class.app-ui-row-neutral]="selectedServiceId() !== service.id">
								<button type="button" class="flex min-w-0 flex-1 items-center gap-3 text-left" (click)="selectService(service.id)">
									<span class="app-ui-list-glyph" aria-hidden="true"><i class="bi bi-scissors"></i></span>
									<div class="min-w-0">
										<div class="flex items-center gap-2">
											<p class="truncate text-sm font-semibold text-slate-800">{{ service.name }}</p>
											@if (serviceHasPendingEdits(service.id)) {
												<span class="rounded-full bg-amber-100 px-2 py-0.5 text-[10px] font-semibold uppercase tracking-[0.08em] text-amber-700 ring-1 ring-amber-300">{{ 'dashboard.common.unsaved' | transloco }}</span>
											}
										</div>
										<p class="truncate text-xs text-slate-500">{{ service.durationSeconds }} {{ 'dashboard.services.secondsSuffix' | transloco }}</p>
									</div>
								</button>
								<app-filter-popover [icon]="'more_vert'" [ariaLabel]="'dashboard.services.rowMenuAriaLabel' | transloco" [panelSize]="'sm'">
									<div class="app-ui-menu-list">
										<button type="button" class="app-ui-menu-item" (click)="selectService(service.id)">
											<span class="app-ui-menu-item-glyph" aria-hidden="true"><i class="bi bi-pencil-square"></i></span>
											<span>{{ 'common.edit' | transloco }}</span>
										</button>
									</div>
								</app-filter-popover>
							</div>
						}
					</pp-fixed-slots-list>
				</div>
			</div>
		</div>

		@if (activeService(); as service) {
			<div class="services-editor-card rounded-2xl border border-slate-200 bg-white p-2 shadow-sm">
				<div class="services-editor-scroll">
					<app-service-form [service]="service" [resourceTypes]="resourceTypes()" (updateService)="onUpdateService($event)" (addRequirement)="onAddRequirement($event)" (updateRequirement)="onUpdateRequirement($event)" (removeRequirement)="onRemoveRequirement($event)" />
				</div>
			</div>
		}
	</div>
</section>
