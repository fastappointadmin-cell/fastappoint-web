<div class="dashboard-page-header services-page-header rounded-2xl border-t border-slate-200 bg-white p-4 shadow-sm ring-1 ring-slate-200" data-tour="services-header">
	<div class="flex items-center justify-between gap-3">
		<div>
			<h2 class="text-xl font-semibold text-slate-900">{{ 'dashboard.services.heading' | transloco }}</h2>
			<p class="text-sm text-slate-600">{{ 'dashboard.services.subheading' | transloco }}</p>
		</div>
		<div class="flex h-11 w-11 items-center justify-center rounded-xl bg-sky-100 text-sky-700">
			<i class="bi bi-scissors" aria-hidden="true"></i>
		</div>
	</div>
</div>

<section class="dashboard-page-body services-scroll-section" data-tour="services-section">
	<app-services-panel
		[services]="services()"
		[resourceTypes]="resourceTypes()"
		(createService)="createService($event)"
		(updateService)="updateService($event)"
		(addRequirement)="addRequirement($event)"
		(updateRequirement)="updateRequirement($event)"
		(removeRequirement)="removeRequirement($event)"
	/>
</section>
